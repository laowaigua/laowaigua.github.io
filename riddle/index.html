<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico">
<title>灯谜答案查询器</title>
<!--<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>">-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e1e6ed;
    --primary: #0066cc;
    --primary-hover: #0052a3;
    --text: #2c3e50;
    --text-light: #7f8c9a;
    --hover: #eef4fb;
    --selected: #d6e8fb;
    --accent: #c0392b;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  /* ===== 顶部居中标题 ===== */
  .page-header {
    width: 100%;
    max-width: 1400px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
  }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    display: inline-block;
  }

  .page-title .lantern {
    margin-right: 8px;
  }

  /* 右下角版本号 */
  .version-badge {
    position: absolute;
    right: 0;
    bottom: 2px;
    font-size: 12px;
    color: var(--text-light);
    font-family: "SF Mono", Consolas, Menlo, monospace;
  }

  /* ===== 主卡片 ===== */
  .app {
    width: 100%;
    max-width: 1400px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex: 1;
    min-height: 0;
    max-height: 1000px;
  }

  /* ===== 顶部搜索区 ===== */
  .search-bar {
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-bar label {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
  }

  #searchInput {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  #searchInput:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
  }

  .btn {
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }

  .btn-secondary { background: #eef1f5; color: var(--text); }
  .btn-secondary:hover { background: #e2e7ee; }

  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { background: #b8c9dc; cursor: not-allowed; }

  /* ===== 统计信息 ===== */
  .stats {
    padding: 6px 24px;
    font-size: 13px;
    color: var(--text-light);
    border-bottom: 1px solid var(--border);
  }

  /* ===== 列表区 ===== */
  .list-wrap {
    flex: 1;
    overflow: auto;
    position: relative;
    min-height: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    table-layout: fixed;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #fafbfc;
  }

  thead th {
    text-align: left;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-light);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th.col-type,   td.col-type   { width: 80px;  text-align: center; }
  th.col-hint,   td.col-hint   { width: 160px; text-align: center; }
  th.col-answer, td.col-answer { width: 220px; text-align: center; }

  tbody tr {
    cursor: pointer;
    transition: background 0.12s;
    border-bottom: 1px solid #f2f5f8;
  }

  tbody tr:hover { background: var(--hover); }
  tbody tr.selected { background: var(--selected); }

  tbody td {
    padding: 11px 16px;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  td.col-answer {
    font-weight: 600;
    color: var(--primary);
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    font-size: 15px;
  }

  /* ===== 底部答案区 ===== */
  .answer-panel {
    border-top: 2px solid var(--border);
    padding: 14px 24px 16px;
    background: #fafbfc;
  }

  .answer-panel .title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .line1 {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 10px;
    word-break: break-word;
  }

  .line1 .hint-tag {
    display: inline-block;
    background: #e8f0fb;
    color: var(--primary);
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 8px;
    font-weight: 500;
  }

  .line2 {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .answer-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .answer-text .check { margin-right: 4px; }

  .placeholder {
    color: var(--text-light);
    font-size: 14px;
    font-weight: 400;
  }

  /* ===== 页面最底部 ===== */
  .page-footer {
    width: 100%;
    max-width: 1400px;
    text-align: center;
    margin-top: 16px;
    padding: 12px 0 4px;
    font-size: 13px;
    color: var(--text-light);
    letter-spacing: 0.5px;
  }

  .page-footer a {
    color: var(--text-light);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    transition: color 0.2s, border-color 0.2s;
  }

  .page-footer a:hover {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2c3e50;
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 响应式 */
  @media (max-width: 900px) {
    th.col-type,   td.col-type   { width: 60px; }
    th.col-hint,   td.col-hint   { width: 110px; }
    th.col-answer, td.col-answer { width: 140px; }
    tbody td { padding: 10px 12px; }
    .page-title { font-size: 22px; }
  }

  @media (max-width: 640px) {
    body { padding: 0; }
    .page-header { padding: 12px 12px 0; margin-bottom: 10px; }
    .page-title { font-size: 19px; letter-spacing: 1px; }
    .version-badge { font-size: 11px; right: 12px; }
    .app {
      border-radius: 0;
      max-height: none;
    }
    th.col-hint, td.col-hint { display: none; }
    .search-bar { padding: 12px; }
    .answer-text { font-size: 17px; }
    .page-footer { margin-top: 10px; padding: 8px 0; }
  }

  /* 滚动条美化 */
  .list-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
  .list-wrap::-webkit-scrollbar-track { background: transparent; }
  .list-wrap::-webkit-scrollbar-thumb {
    background: #ccd5e0;
    border-radius: 5px;
  }
  .list-wrap::-webkit-scrollbar-thumb:hover { background: #b0bdcd; }
</style>
</head>
<body>

<!-- 顶部居中标题 -->
<header class="page-header">
  <h1 class="page-title">灯谜答案查询器</h1>
  <span class="version-badge">v260927</span>
</header>

<!-- 主卡片 -->
<div class="app">
  <div class="search-bar">
    <label for="searchInput">🔍</label>
    <input type="text" id="searchInput" placeholder="输入关键词搜索题目、提示或答案…" autocomplete="off">
    <button class="btn btn-secondary" id="clearBtn">清空</button>
  </div>

  <div class="stats" id="stats">加载中…</div>

  <div class="list-wrap" id="listWrap">
    <table>
      <thead>
        <tr>
          <th class="col-type">编号</th>
          <th>题目</th>
          <th class="col-hint">提示</th>
          <th class="col-answer">答案</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">没有找到匹配的灯谜</div>
  </div>

  <div class="answer-panel">
    <div class="title">答案详情（双击列表行即可复制） </div>
    <div class="line1" id="line1">
      <span class="placeholder">请在上方列表中选择一个题目</span>
    </div>
    <div class="line2">
      <div class="answer-text" id="line2"></div>
      <button class="btn btn-primary" id="copyBtn" disabled>📋 复制答案</button>
    </div>
  </div>
</div>

<!-- 页面最底部 -->
<footer class="page-footer">
  <a href="https://laowaigua.github.io" target="_blank" rel="noopener">laowaigua.github.io</a>
</footer>

<div class="toast" id="toast">✅ 已复制到剪贴板</div>

<script>
let RIDDLE_DATA = [];
let filteredData = [];
let currentAnswer = null;
let selectedType = null;

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const tbody = document.getElementById('tbody');
const emptyEl = document.getElementById('empty');
const statsEl = document.getElementById('stats');
const line1El = document.getElementById('line1');
const line2El = document.getElementById('line2');
const copyBtn = document.getElementById('copyBtn');
const toastEl = document.getElementById('toast');

async function loadData() {
  if (location.protocol === 'file:') {
    statsEl.textContent = '❌ 检测到 file:// 协议，浏览器禁止加载本地 JSON。请用 HTTP 服务，或将数据内嵌到 HTML 中。';
    return;
  }
  try {
    const res = await fetch('riddleConfig.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    RIDDLE_DATA = await res.json();
  } catch (err) {
    console.error('加载 riddleConfig.json 失败：', err);
    statsEl.textContent = '❌ 数据加载失败：' + err.message;
    return;
  }
  filteredData = RIDDLE_DATA.slice();
  renderList();
}

function renderList() {
  const frag = document.createDocumentFragment();

  if (filteredData.length === 0) {
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    for (const item of filteredData) {
      const tr = document.createElement('tr');
      tr.dataset.type = item.type;

      const tdType = document.createElement('td');
      tdType.className = 'col-type';
      tdType.textContent = item.type;

      const tdQ = document.createElement('td');
      tdQ.textContent = item.pcontent;
      tdQ.title = item.pcontent;

      const tdHint = document.createElement('td');
      tdHint.className = 'col-hint';
      tdHint.textContent = item.hint;
      tdHint.title = item.hint;

      const tdAns = document.createElement('td');
      tdAns.className = 'col-answer';
      tdAns.textContent = item.answer;
      tdAns.title = item.answer;

      tr.append(tdType, tdQ, tdHint, tdAns);
      frag.appendChild(tr);
    }
  }

  tbody.innerHTML = '';
  tbody.appendChild(frag);

  if (selectedType !== null) {
    const prev = tbody.querySelector(`tr[data-type="${selectedType}"]`);
    if (prev) prev.classList.add('selected');
  }

  const total = RIDDLE_DATA.length;
  const shown = filteredData.length;
  if (shown === total) {
    statsEl.textContent = `共 ${total} 条灯谜`;
  } else {
    statsEl.textContent = `匹配到 ${shown} 条 / 共 ${total} 条灯谜`;
  }
}

function onSearch() {
  const kw = searchInput.value.trim().toLowerCase();
  if (!kw) {
    filteredData = RIDDLE_DATA.slice();
  } else {
    filteredData = RIDDLE_DATA.filter(item =>
      item.pcontent.toLowerCase().includes(kw) ||
      item.hint.toLowerCase().includes(kw) ||
      item.answer.toLowerCase().includes(kw)
    );
  }
  renderList();
}

function onRowClick(e) {
  const tr = e.target.closest('tr');
  if (!tr) return;

  tbody.querySelectorAll('tr.selected').forEach(el => el.classList.remove('selected'));
  tr.classList.add('selected');

  const typeNum = Number(tr.dataset.type);
  selectedType = typeNum;

  const item = RIDDLE_DATA.find(d => d.type === typeNum);
  if (!item) return;

  line1El.innerHTML = '';
  const tag = document.createElement('span');
  tag.className = 'hint-tag';
  tag.textContent = item.hint;
  line1El.appendChild(tag);
  line1El.appendChild(document.createTextNode(item.pcontent));

  line2El.innerHTML = '';
  const check = document.createElement('span');
  check.className = 'check';
  check.textContent = '✅';
  line2El.appendChild(check);
  line2El.appendChild(document.createTextNode(item.answer));

  currentAnswer = item.answer;
  copyBtn.disabled = false;
}

async function copyAnswer() {
  if (!currentAnswer) return;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(currentAnswer);
    } else {
      const ta = document.createElement('textarea');
      ta.value = currentAnswer;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    showToast('✅ 已复制：' + currentAnswer);
  } catch (err) {
    console.error(err);
    showToast('❌ 复制失败，请手动选择复制');
  }
}

let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function clearSearch() {
  searchInput.value = '';
  onSearch();
  searchInput.focus();
  resetAnswerPanel();
}

function resetAnswerPanel() {
  selectedType = null;
  currentAnswer = null;
  copyBtn.disabled = true;
  line1El.innerHTML = '<span class="placeholder">请在上方列表中选择一个题目</span>';
  line2El.innerHTML = '';
}

searchInput.addEventListener('input', onSearch);
clearBtn.addEventListener('click', clearSearch);
copyBtn.addEventListener('click', copyAnswer);
tbody.addEventListener('click', onRowClick);
tbody.addEventListener('dblclick', e => {
  const tr = e.target.closest('tr');
  if (!tr) return;
  onRowClick(e);
  copyAnswer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});

loadData();
</script>
</body>
</html>
